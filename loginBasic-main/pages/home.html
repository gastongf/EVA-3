<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio</title>
  <link rel="stylesheet" href="../asset/css/styles.css" />
  <style>
    .home-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .home-card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(21, 101, 192, 0.12);
      border: 1px solid rgba(144, 202, 249, 0.4);
      text-align: center;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1565C0, #1976D2);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 700;
      margin: 0 auto 16px;
      box-shadow: 0 4px 12px rgba(21, 101, 192, 0.25);
    }

    .home-card h1 {
      margin: 0 0 4px;
      font-size: 1.6rem;
    }

    .home-card .subtitle {
      color: #49454f;
      margin: 0 0 24px;
      font-size: 0.95rem;
    }

    .info-grid {
      background: #eef5fc;
      border-radius: 14px;
      padding: 4px 0;
      margin-bottom: 24px;
      text-align: left;
      overflow: hidden;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(144, 202, 249, 0.3);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #49454f;
      font-size: 0.88rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-value {
      color: #1c1b1f;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: right;
      word-break: break-all;
    }

    .logout-btn {
      width: 100%;
      min-height: 50px;
      border: none;
      border-radius: 999px;
      background: #1565C0;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.25s ease;
      box-shadow: 0 6px 16px rgba(21, 101, 192, 0.25);
    }

    .logout-btn:hover {
      background: #0d47a1;
    }

    .logout-btn:active {
      transform: scale(0.98);
    }

    @media (max-width: 480px) {
      .home-card {
        padding: 24px 20px;
      }

      .info-row {
        padding: 12px 16px;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .info-value {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="home-page">
    <section class="home-card">
      <div class="avatar" id="avatar">U</div>
      <p class="subtitle" id="welcomeText" style="margin:0 0 4px;font-size:1.1rem;font-weight:600;color:#1c1b1f;"></p>
      <p class="subtitle" id="sessionText">Has iniciado sesión correctamente.</p>

      <div class="info-grid" id="userInfo"></div>

      <button id="logoutBtn" class="logout-btn">Cerrar sesión</button>
    </section>
  </main>

  <script>
    const isAuthenticated = localStorage.getItem("isAuthenticated");
    const user = JSON.parse(localStorage.getItem("user"));

    if (isAuthenticated !== "true" || !user) {
      window.location.href = "../index.html";
    }

    const avatar = document.getElementById("avatar");
    const welcomeText = document.getElementById("welcomeText");
    const sessionText = document.getElementById("sessionText");
    const userInfo = document.getElementById("userInfo");

    const initials = (user.nombres?.charAt(0) || "").toUpperCase();
    avatar.textContent = initials || "U";
    welcomeText.innerHTML = `Bienvenido(a), <strong>${user.nombres || "Usuario"}</strong>`;

    userInfo.innerHTML = `
      <div class="info-row">
        <span class="info-label">📧 Correo</span>
        <span class="info-value">${user.email}</span>
      </div>
      <div class="info-row">
        <span class="info-label">👤 Nombres</span>
        <span class="info-value">${user.nombres}</span>
      </div>
      <div class="info-row">
        <span class="info-label">👤 Apellidos</span>
        <span class="info-value">${user.apellidos}</span>
      </div>
    `;

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("isAuthenticated");
      localStorage.removeItem("user");
      window.location.href = "../index.html";
    });
  </script>
</body>
</html>
