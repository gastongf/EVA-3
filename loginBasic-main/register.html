<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="asset/css/styles.css" />
</head>
<body>
  <main class="login-page" aria-labelledby="register-title">
    <section class="login-card" aria-label="Formulario de registro">
      <header class="login-header">
        <div class="brand-badge" aria-hidden="true">📝</div>
        <h1 id="register-title">Crear cuenta</h1>
        <p class="subtitle">Regístrate para acceder al sistema</p>
      </header>

      <form id="registerForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="nombres">Nombres</label>
          <input type="text" id="nombres" name="nombres" placeholder="Tus nombres" required />
          <small id="nombresError" class="error-text" aria-live="polite"></small>
        </div>

        <div class="form-group">
          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" name="apellidos" placeholder="Tus apellidos" required />
          <small id="apellidosError" class="error-text" aria-live="polite"></small>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" inputmode="email" autocomplete="email" placeholder="ejemplo@correo.com" required />
          <small id="emailError" class="error-text" aria-live="polite"></small>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required minlength="8" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
          </div>
          <small id="passwordError" class="error-text" aria-live="polite"></small>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-text">Crear cuenta</span>
        </button>

        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </form>

      <footer class="login-footer">
        <p>¿Ya tienes cuenta? <a href="index.html" class="link">Iniciar sesión</a></p>
      </footer>
    </section>
  </main>

  <script src="asset/js/register.js"></script>
</body>
</html>
