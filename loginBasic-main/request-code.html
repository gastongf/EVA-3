<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitar código</title>
  <link rel="stylesheet" href="asset/css/styles.css" />
</head>
<body>
  <main class="login-page" aria-labelledby="request-title">
    <section class="login-card" aria-label="Formulario de solicitud de código">
      <header class="login-header">
        <div class="brand-badge" aria-hidden="true">🔑</div>
        <h1 id="request-title">Recuperar contraseña</h1>
        <p class="subtitle">Ingresa tu correo para recibir un código de recuperación</p>
      </header>

      <form id="requestCodeForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" inputmode="email" autocomplete="email" placeholder="ejemplo@correo.com" required />
          <small id="emailError" class="error-text" aria-live="polite"></small>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-text">Enviar código</span>
        </button>

        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </form>

      <footer class="login-footer">
        <p><a href="change-password.html" class="link">Ya tengo un código</a></p>
        <p><a href="index.html" class="link">Volver al inicio de sesión</a></p>
      </footer>
    </section>
  </main>

  <script src="asset/js/request-code.js"></script>
</body>
</html>
