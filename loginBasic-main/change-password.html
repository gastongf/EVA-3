<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambiar contraseña</title>
  <link rel="stylesheet" href="asset/css/styles.css" />
</head>
<body>
  <main class="login-page" aria-labelledby="change-title">
    <section class="login-card" aria-label="Formulario de cambio de contraseña">
      <header class="login-header">
        <div class="brand-badge" aria-hidden="true">🔒</div>
        <h1 id="change-title">Cambiar contraseña</h1>
        <p class="subtitle">Valida tu código y luego cambia tu contraseña</p>
      </header>

      <form id="changePasswordForm" class="login-form" novalidate>
        <div id="stepCode" class="form-step">
          <div class="form-group">
            <label for="code">Código de recuperación</label>
            <input type="text" id="code" name="code" placeholder="Código de 6 dígitos" required maxlength="6" inputmode="numeric" />
            <small id="codeError" class="error-text" aria-live="polite"></small>
          </div>

          <button type="button" class="btn-primary" id="validateCodeBtn">
            <span class="btn-text">Validar código</span>
          </button>

          <p id="codeMessage" class="form-message" aria-live="polite"></p>
        </div>

        <div id="stepPassword" class="form-step hidden">
          <div class="form-group">
            <label for="password">Nueva contraseña</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required minlength="8" />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
            </div>
            <small id="passwordError" class="error-text" aria-live="polite"></small>
          </div>

          <div class="form-group">
            <label for="password2">Confirmar contraseña</label>
            <div class="password-wrapper">
              <input type="password" id="password2" name="password2" autocomplete="new-password" placeholder="Repite la nueva contraseña" required minlength="8" />
            </div>
            <small id="password2Error" class="error-text" aria-live="polite"></small>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">
            <span class="btn-text">Cambiar contraseña</span>
          </button>

          <p id="formMessage" class="form-message" aria-live="polite"></p>
        </div>
      </form>

      <footer class="login-footer">
        <p><a href="request-code.html" class="link">Solicitar nuevo código</a></p>
        <p><a href="index.html" class="link">Volver al inicio de sesión</a></p>
      </footer>
    </section>
  </main>

  <script src="asset/js/change-password.js"></script>
</body>
</html>
